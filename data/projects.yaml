# The group's research projects, shown on /projects/ and on the front page.
#
# A project counts as current until the end of its `end` year, and as
# current indefinitely when `end` is left out; after that it moves to
# "Past projects" by itself.
#
#   title    project name (required)
#   url      project web page
#   funder   who funds it
#   start    first year
#   end      last year
#   role     the group's role, e.g. lead
#   area     life sciences | humanities | data science
#   summary  one sentence
#   grants   grant codes as used in the `funding` field of lahti.bib

